      <circle cx="0" cy="0" r="30" fill="#061C38"/>
      <!-- Text 33 -->
      <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="28" fill="#F5BA13">33</text>
    </g>
  </svg>